<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Composites</h1>
    <p-button (onClick)="openCreate()" severity="primary" [outlined]="true" label="+ New Composite"/>
  </div>

  <!-- Create Form -->
  @if (showCreateForm()) {
    <p-card styleClass="mb-6">
      <h3 class="font-semibold mb-4">New Composite</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Display Name *</label>
          <input type="text" pInputText [(ngModel)]="newDisplayName" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newName" class="w-full"/>
          @if (nameTaken()) {
            <small class="text-red-500 mt-1 block">Name already exists</small>
          }
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Type *</label>
          <p-select [(ngModel)]="newTypeId" [options]="compositeService.compositeTypes()" optionLabel="display_name" optionValue="id" placeholder="Select type"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newDescription" class="w-full"/>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-surface-500 mb-1">Initial Members (Instruments)</label>
          <p-multiselect [(ngModel)]="selectedInstruments" [options]="assetService.instruments()" optionLabel="display_name"
                         placeholder="Select instruments" [filter]="true" display="chip" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [text]="true" label="Cancel"/>
      </div>
    </p-card>
  }

  <!-- Composites Table -->
  <app-data-table
    [columns]="columns"
    [rowData]="enrichedComposites()"
    [loading]="compositeService.composites().length === 0 && !showCreateForm()"
    [rowClickRoute]="navigateToComposite"
    emptyMessage="No composites found."/>
</div>
