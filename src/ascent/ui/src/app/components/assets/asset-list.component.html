<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Assets</h1>
    <p-button (onClick)="openCreate()" severity="info" [outlined]="true" label="+ New Asset"/>
  </div>

  <!-- Create Form -->
  @if (showCreateForm()) {
    <p-card styleClass="mb-6">
      <h3 class="font-semibold mb-4">New Asset</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newAssetName" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Symbol *</label>
          <input type="text" pInputText [(ngModel)]="newAssetSymbol" class="w-full"/>
          @if (symbolTaken()) {
            <small class="text-red-500 mt-1 block">Symbol already exists</small>
          }
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Type *</label>
          <p-select [(ngModel)]="newAssetTypeId" [options]="assetService.assetTypes()" optionLabel="name" optionValue="id" placeholder="Select type"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newAssetDescription" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [text]="true" label="Cancel"/>
      </div>
    </p-card>
  }

  <!-- Assets Table -->
  <p-card styleClass="overflow-hidden">
    <p-table [value]="assetService.assets()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50, 100]"
             [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} assets"
             [loading]="assetService.loading()"
             [tableStyle]="{'width': '100%'}">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name"/></th>
          <th pSortableColumn="symbol">Symbol <p-sortIcon field="symbol"/></th>
          <th pSortableColumn="asset_type_name">Type <p-sortIcon field="asset_type_name"/></th>
          <th pSortableColumn="is_active" class="w-28">Status <p-sortIcon field="is_active"/></th>
        </tr>
        <tr>
          <th>
            <p-columnFilter field="name" matchMode="contains" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <input type="text" pInputText (input)="filter($any($event.target).value)" placeholder="Filter name" class="w-full"/>
              </ng-template>
            </p-columnFilter>
          </th>
          <th>
            <p-columnFilter field="symbol" matchMode="contains" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <input type="text" pInputText (input)="filter($any($event.target).value)" placeholder="Filter symbol" class="w-full"/>
              </ng-template>
            </p-columnFilter>
          </th>
          <th>
            <p-columnFilter field="asset_type_name" matchMode="in" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <p-multiselect [options]="typeNames()" (onChange)="filter($event.value)" placeholder="All Types"
                               [maxSelectedLabels]="1" selectedItemsLabel="{0} types"/>
              </ng-template>
            </p-columnFilter>
          </th>
          <th>
            <p-columnFilter field="is_active" matchMode="equals" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <p-select [options]="statusOptions" (onChange)="filter($event.value)" placeholder="All"
                           optionLabel="label" optionValue="value" [showClear]="true"/>
              </ng-template>
            </p-columnFilter>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-asset>
        <tr class="cursor-pointer hover:bg-emphasis transition-colors" (click)="navigateToAsset(asset.id)">
          <td class="font-medium">{{ asset.name }}</td>
          <td class="font-mono text-surface-500">{{ asset.symbol ?? '—' }}</td>
          <td>{{ asset.asset_type_name ?? 'Unknown' }}</td>
          <td>
            <p-tag [value]="asset.is_active ? 'Active' : 'Inactive'" [severity]="asset.is_active ? 'success' : 'secondary'" [rounded]="true"/>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingicon/>
      <ng-template #loadingbody>
        <tr>
          @for (_ of [1,2,3,4]; track $index) {
            <td><p-skeleton width="75%" height="1rem"/></td>
          }
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="text-center text-surface-400 py-8">No assets found.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
