<div class="transition-opacity duration-200" [class.opacity-40]="loading()" [class.pointer-events-none]="loading()">
  <!-- Desktop Table -->
  <div class="hidden md:block rounded-lg overflow-clip border border-edge" [attr.data-ag-theme-mode]="themeMode()">
    <ag-grid-angular
      [theme]="theme"
      [rowData]="trades()"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      [domLayout]="'autoHeight'"
      [suppressCellFocus]="true"
      [rowClass]="'cursor-pointer'"
      [overlayNoRowsTemplate]="'<span style=&quot;font-size:12px;opacity:0.5&quot;>No trades</span>'"
      (rowClicked)="onRowClicked($event)"/>
  </div>

  <!-- Mobile Cards -->
  <div class="md:hidden flex flex-col gap-3">
    @for (trade of trades(); track trade.id) {
      <p-card styleClass="cursor-pointer hover:bg-emphasis transition-colors" (click)="navigateToTrade(trade.id)">
        <div class="flex items-center justify-between mb-2">
          <span class="font-medium">{{ trade.display_symbol }}</span>
          @if (trade.current_status) {
            <app-badge [label]="trade.current_status" variant="status"/>
          }
        </div>
        <div class="flex items-center gap-2 mb-2">
          @for (tag of trade.tags; track tag) {
            <app-badge [label]="tag"/>
          }
        </div>
        @if (showStrategy()) {
          <p class="text-xs text-surface-500 mb-1">{{ trade.strategy_name }}</p>
        }
        <app-stat-card label="P&L" [value]="tradeService.formatCurrency(trade.total_realized_pnl)" [valueClass]="tradeService.getPnlClass(trade.total_realized_pnl)" variant="flat" size="sm"/>
      </p-card>
    } @empty {
      <app-empty-state title="No trades" icon="data"/>
    }
  </div>

  <!-- Pagination -->
  @if (totalPages() > 1) {
    <div class="flex items-center justify-between mt-4 px-2 text-xs text-fg-muted">
      <span>Page {{ page() }} of {{ totalPages() }}</span>
      <div class="flex gap-1">
        <button (click)="onPageChange(page() - 1)" [disabled]="page() <= 1" class="px-3 py-1.5 rounded border border-edge text-fg hover:bg-elevated disabled:opacity-30 disabled:cursor-not-allowed">Prev</button>
        <button (click)="onPageChange(page() + 1)" [disabled]="page() >= totalPages()" class="px-3 py-1.5 rounded border border-edge text-fg hover:bg-elevated disabled:opacity-30 disabled:cursor-not-allowed">Next</button>
      </div>
    </div>
  }
</div>
