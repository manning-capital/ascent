<app-page-header
  [title]="loading() ? 'Loading…' : 'Run #' + (run()?.id ?? '').slice(0, 8)"
  [breadcrumb]="breadcrumb()"
>
  <div actions class="flex items-center gap-2">
    @if (loading()) {
      <p-skeleton width="6rem" height="1.5rem" />
    } @else if (run(); as r) {
      <p-tag [value]="r.status" [severity]="statusSeverity(r.status)" [rounded]="true" />
      <p-tag
        [value]="r.snapshot_timestamp"
        severity="secondary"
        [rounded]="true"
        icon="pi pi-calendar"
      />
      @if (r.records_fetched != null) {
        <p-tag [value]="r.records_fetched + ' records'" severity="secondary" [rounded]="true" />
      }
    }
  </div>
</app-page-header>

@if (run()?.status === 'FAILED' && run()?.error_message) {
  <p-message severity="error" class="shrink-0 block">
    <span class="text-xs font-mono whitespace-pre-wrap break-words">{{ run()?.error_message }}</span>
  </p-message>
}

<p-splitter
  layout="horizontal"
  [panelSizes]="hSizes()"
  stateKey="feed-run-detail-h-split"
  stateStorage="local"
  class="flex-1 min-h-0"
  styleClass="border-0 rounded-none"
>
  <ng-template #panel>
    <p-splitter
      layout="vertical"
      [panelSizes]="vSizes"
      stateKey="feed-run-detail-v-split"
      stateStorage="local"
      class="h-full w-full"
      styleClass="border-0 rounded-none h-full"
    >
      <ng-template #panel>
        <app-feed-run-top-panel [run]="run()" [feedId]="feedId" />
      </ng-template>
      <ng-template #panel>
        <app-feed-run-bottom-panel [run]="run()" [feedId]="feedId" />
      </ng-template>
    </p-splitter>
  </ng-template>
  <ng-template #panel>
    <app-feed-run-stats-rail
      [run]="run()"
      [feedId]="feedId"
      [(collapsed)]="railCollapsed"
    />
  </ng-template>
</p-splitter>
