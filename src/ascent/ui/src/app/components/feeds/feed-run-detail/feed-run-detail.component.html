<div class="flex flex-col h-[calc(100vh-3.5rem)]">
  <!-- Header -->
  <div class="flex items-center gap-3 px-4 py-2 border-b border-surface shrink-0 bg-emphasis">
    <a [routerLink]="['/feeds', feedId]" [queryParams]="{tab: 'Runs'}" class="text-sm text-primary hover:underline">&larr; Runs</a>
    <span class="text-surface-300">|</span>
    @if (loading()) {
      <p-skeleton width="8rem" height="1.25rem"/>
    } @else {
      <h1 class="text-lg font-bold truncate">Run #{{ run()?.id }}</h1>
      @if (run(); as r) {
        <p-tag [value]="r.status" [severity]="statusSeverity(r.status)" [rounded]="true"/>
      }
    }
  </div>

  <!-- Tabs -->
  <p-tabs class="shrink-0" [value]="activeTab()" (valueChange)="onTabChange($any($event))">
    <p-tablist>
      <p-tab value="Overview">Overview</p-tab>
      <p-tab value="Partition">Partition Data</p-tab>
    </p-tablist>
  </p-tabs>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto">
    @if (activeTab() === 'Overview') {
      <div class="p-6 space-y-5 max-w-4xl mx-auto">
        @if (loading()) {
          <div class="space-y-4">
            <p-skeleton width="100%" height="2rem"/>
            <p-skeleton width="100%" height="1.5rem"/>
            <p-skeleton width="100%" height="1.5rem"/>
            <p-skeleton width="100%" height="1.5rem"/>
            <p-skeleton width="100%" height="1.5rem"/>
          </div>
        } @else if (run(); as r) {
          <app-run-detail-card [run]="r" [extraFields]="extraFields"/>
        }
      </div>
    }
    @if (activeTab() === 'Partition') {
      <div class="p-6">
        @if (run()?.partition_id) {
          <app-server-table
            [fetchPage]="partitionFetchPage()"
            [autoColumns]="true"
            [autoLinks]="true"
            [rowHeight]="32"
            [headerHeight]="32"/>
        } @else {
          <app-empty-state title="No partition" message="This run does not have associated partition data." icon="inbox"/>
        }
      </div>
    }
  </div>
</div>
