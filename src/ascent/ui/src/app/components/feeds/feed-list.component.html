<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Feeds</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rowData]="feedService.feeds()"
    [loading]="feedService.loading() && feedService.feeds().length === 0"
    [rowClickRoute]="navigateToFeed"
    emptyMessage="No feeds found."/>
</div>
