<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Strategies</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rowData]="strategyService.strategies()"
    [loading]="strategyService.loading() && strategyService.strategies().length === 0"
    [rowClickRoute]="navigateToStrategy"
    emptyMessage="No strategies found."/>
</div>
