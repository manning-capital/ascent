<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Exchanges</h1>
  </div>

  <app-data-table
    [columns]="columns"
    [rowData]="exchangeService.exchanges()"
    [loading]="exchangeService.loading() && exchangeService.exchanges().length === 0"
    [rowClickRoute]="navigateToExchange"
    emptyMessage="No exchanges found."/>
</div>
