<app-page-header title="Exchanges" />

<div class="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-edge bg-canvas shrink-0">
  <span class="relative">
    <i class="pi pi-search absolute left-2 top-1/2 -translate-y-1/2 text-fg-faint text-xs"></i>
    <input
      type="text"
      pInputText
      placeholder="Search exchanges"
      class="pl-7 text-xs"
      style="width: 14rem;"
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
    />
  </span>

  <p-select
    [ngModel]="statusFilter()"
    (ngModelChange)="onStatusChange($event)"
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="All statuses"
    [showClear]="true"
    size="small"
    [style]="{ width: '11rem' }"
  />

  <p-button
    label="Clear filters"
    severity="secondary"
    [text]="true"
    size="small"
    icon="pi pi-filter-slash"
    (onClick)="clearFilters()"
  />
</div>

<div class="flex-1 min-h-0 flex flex-col">
  <p-dataView
    [value]="items()"
    [paginator]="true"
    [rows]="pageSize()"
    [totalRecords]="total()"
    [first]="first()"
    [lazy]="true"
    [loading]="loading()"
    [rowsPerPageOptions]="[25, 50, 100]"
    layout="list"
    (onLazyLoad)="onLazyLoad($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    styleClass="border-0"
  >
    <ng-template #list let-exchanges>
      <div class="flex flex-col">
        @for (e of exchanges; track e.id) {
          <button
            type="button"
            class="text-left px-4 py-3 border-b border-edge hover:bg-edge-dim transition-colors flex items-center gap-4 w-full"
            (click)="navigateToExchange(e)"
          >
            <!-- Status dot -->
            <app-status-dot
              [severity]="dotSeverity(e)"
              [size]="10"
            />

            <!-- Name + code -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-fg truncate">{{ e.display_name }}</span>
                @if (!e.is_active) {
                  <span class="text-[10px] uppercase tracking-wider text-fg-faint">Inactive</span>
                }
              </div>
              <div class="text-[11px] font-mono text-fg-faint mt-0.5 truncate">
                {{ e.name }}
              </div>
            </div>

            <!-- Instrument type -->
            <div class="hidden sm:flex flex-col items-end shrink-0" style="width: 9rem;">
              <span class="text-[10px] uppercase tracking-wider text-fg-faint">Type</span>
              @if (e.instrument_type_name) {
                <span class="text-sm text-fg truncate" style="max-width: 100%;">{{ e.instrument_type_name }}</span>
              } @else {
                <span class="text-fg-faint text-xs">Any</span>
              }
            </div>

            <!-- Provider -->
            <div class="hidden md:flex flex-col items-end shrink-0" style="width: 9rem;">
              <span class="text-[10px] uppercase tracking-wider text-fg-faint">Provider</span>
              @if (e.provider_name) {
                <span class="text-sm text-fg truncate" style="max-width: 100%;">{{ e.provider_name }}</span>
              } @else {
                <span class="text-fg-faint text-xs">None</span>
              }
            </div>

            <!-- Created -->
            <div class="hidden lg:flex flex-col items-end shrink-0" style="width: 6rem;">
              <span class="text-[10px] uppercase tracking-wider text-fg-faint">Created</span>
              <app-relative-time [value]="e.created_at" />
            </div>

            <i class="pi pi-chevron-right text-fg-faint text-xs shrink-0"></i>
          </button>
        }
      </div>
    </ng-template>

    <ng-template #emptymessage>
      <app-empty-state title="No exchanges found." />
    </ng-template>

    <ng-template #loadingicon>
      <i class="pi pi-spin pi-spinner text-fg-muted"></i>
    </ng-template>
  </p-dataView>
</div>
