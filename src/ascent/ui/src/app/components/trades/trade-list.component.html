<div class="flex flex-col h-full min-h-0">
  <app-page-header title="Trades" subtitle="Live · streaming">
    <div actions class="flex items-center gap-2">
      <p-button
        label="Clear filters"
        severity="secondary"
        [text]="true"
        size="small"
        icon="pi pi-filter-slash"
        (onClick)="clearFilters()"
      />
    </div>
  </app-page-header>

  <div class="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-edge bg-canvas shrink-0">
    <span class="relative">
      <i class="pi pi-search absolute left-2 top-1/2 -translate-y-1/2 text-fg-faint text-xs"></i>
      <input
        type="text"
        pInputText
        placeholder="Search symbol"
        class="pl-7 text-xs"
        style="width: 14rem;"
        [ngModel]="search()"
        (ngModelChange)="onSearch($event)"
      />
    </span>

    <p-select
      [ngModel]="status()"
      (ngModelChange)="onStatusChange($event)"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="All statuses"
      [showClear]="true"
      size="small"
      styleClass="text-xs"
      [style]="{ width: '11rem' }"
    />

    <p-select
      [ngModel]="selectedStrategyId()"
      (ngModelChange)="onStrategyChange($event)"
      [options]="strategyService.strategies()"
      optionLabel="display_name"
      optionValue="id"
      placeholder="All strategies"
      [showClear]="true"
      [filter]="true"
      filterPlaceholder="Search…"
      size="small"
      styleClass="text-xs"
      [style]="{ width: '14rem' }"
    />

    <p-datepicker
      [ngModel]="startDate()"
      (ngModelChange)="startDate.set($event); onDateChange()"
      dateFormat="yy-mm-dd"
      [showIcon]="true"
      [showButtonBar]="true"
      placeholder="From"
      size="small"
      [style]="{ width: '10rem' }"
    />

    <p-datepicker
      [ngModel]="endDate()"
      (ngModelChange)="endDate.set($event); onDateChange()"
      dateFormat="yy-mm-dd"
      [showIcon]="true"
      [showButtonBar]="true"
      placeholder="To"
      size="small"
      [style]="{ width: '10rem' }"
    />

    <p-selectButton
      [multiple]="true"
      [ngModel]="selectedTags()"
      (ngModelChange)="onTagsChange($event)"
      [options]="availableTags"
      size="small"
    />
  </div>

  <app-trade-table
    class="flex-1 min-h-0"
    [showStrategy]="true"
    [fetchPage]="fetchPageFn()"
    [pageSize]="pageSize()"
    (sortChange)="onSortChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (serverPageChange)="onPageChange($event)"
  />
</div>
