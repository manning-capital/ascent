<div class="p-6 ">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold flex items-center gap-3">
      Trades
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse-live"></span>
    </h1>
    <span class="text-sm text-surface-500">{{ tradeService.totalTrades() }} total</span>
  </div>

  <!-- Filters -->
  <p-card styleClass="mb-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
      <!-- Search -->
      <input
        type="text"
        pInputText
        placeholder="Search symbol..."
        [ngModel]="search()"
        (ngModelChange)="onSearch($event)">

      <!-- Status -->
      <p-select
        [ngModel]="status()"
        (ngModelChange)="onStatusChange($event)"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="All Statuses"
        [showClear]="true"/>

      <!-- Strategy -->
      <p-select
        [ngModel]="selectedStrategyId()"
        (ngModelChange)="onStrategyChange($event)"
        [options]="strategyService.strategies()"
        optionLabel="display_name"
        optionValue="id"
        placeholder="All Strategies"
        [showClear]="true"
        [filter]="true"
        filterPlaceholder="Search strategies..."/>

      <!-- Clear -->
      <p-button (onClick)="clearFilters()" severity="secondary" [outlined]="true" label="Clear Filters"/>
    </div>

    <!-- Date Range -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
      <div class="flex items-center gap-2">
        <label class="text-xs text-surface-500 shrink-0">From:</label>
        <p-datepicker
          [ngModel]="startDate()"
          (ngModelChange)="startDate.set($event); page.set(1)"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          [showButtonBar]="true"
          placeholder="Start date"
          [style]="{'width': '100%'}"/>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-xs text-surface-500 shrink-0">To:</label>
        <p-datepicker
          [ngModel]="endDate()"
          (ngModelChange)="endDate.set($event); page.set(1)"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          [showButtonBar]="true"
          placeholder="End date"
          [style]="{'width': '100%'}"/>
      </div>
    </div>

    <!-- Tags -->
    <div class="flex items-center gap-2">
      <span class="text-xs text-surface-500">Tags:</span>
      <p-selectButton [multiple]="true" [ngModel]="selectedTags()" (ngModelChange)="selectedTags.set($event); page.set(1)" [options]="availableTags"/>
    </div>
  </p-card>

  <!-- Trade Table -->
  <h2 class="text-lg font-semibold mb-3">Trades</h2>
  <p-card styleClass="overflow-hidden">
    <div class="transition-opacity duration-200" [class.opacity-40]="tradeService.loading()" [class.pointer-events-none]="tradeService.loading()">
      <app-trade-table
        [trades]="tradeService.trades()"
        [showStrategy]="true"
        [loading]="tradeService.loading()"
        [page]="page()"
        [totalPages]="tradeService.totalPages()"
        (pageChange)="onPageChange($event)"/>
    </div>
  </p-card>
</div>
