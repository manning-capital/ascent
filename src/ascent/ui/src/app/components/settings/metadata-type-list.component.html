<div class="p-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Metadata Types</h1>
      <p class="text-sm text-surface-500 mt-1">Define metadata field types used across assets, providers, and provider-assets.</p>
    </div>
    <p-button (onClick)="openCreate()" severity="primary" [outlined]="true" size="small" label="+ New Metadata Type"/>
  </div>

  @if (showCreateForm()) {
    <p-card class="mb-6">
      <ng-template #header>
        <div class="px-5 pt-5">
          <h3 class="font-semibold">New Metadata Type</h3>
        </div>
      </ng-template>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. symbol" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Display Name *</label>
          <input type="text" pInputText [(ngModel)]="newDisplayName" placeholder="e.g. Symbol" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Value Type *</label>
          <p-select [(ngModel)]="newValueType" [options]="['string', 'integer', 'float', 'boolean', 'date', 'time', 'datetime']" placeholder="Select value type"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" size="small" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [outlined]="true" size="small" label="Cancel"/>
      </div>
    </p-card>
  }

  <app-data-table
    [columns]="columns"
    [rowData]="fieldService.metadataTypes()"
    [loading]="fieldService.loading()"
    [pagination]="false"
    [rowClickRoute]="navigateToMetadataType"
    emptyMessage="No metadata types defined. Click + New Metadata Type to get started."/>
</div>
