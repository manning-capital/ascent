<div class="p-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Asset Types</h1>
      <p class="text-sm text-surface-500 mt-1">Define asset classifications and their required metadata fields. Click a node to view details.</p>
    </div>
    <p-button (onClick)="openCreate()" severity="info" [outlined]="true" size="small" label="+ New Type"/>
  </div>

  @if (showCreateForm()) {
    <p-card class="mb-6">
      <ng-template #header>
        <div class="px-5 pt-5">
          <h3 class="font-semibold">New Asset Type</h3>
        </div>
      </ng-template>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. Cryptocurrency, Equity" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Parent Type</label>
          <p-select [(ngModel)]="newParentTypeId" [options]="assetService.assetTypes()" optionLabel="name" optionValue="id" placeholder="None (root type)" [showClear]="true" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional description" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" size="small" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [outlined]="true" size="small" label="Cancel"/>
      </div>
    </p-card>
  }

  @if (treeData().length > 0) {
    <div class="h-[500px]">
      <app-asset-type-graph [trees]="treeData()" (nodeClick)="onNodeClick($event)"/>
    </div>
  } @else {
    <div class="text-center text-surface-400 py-12">No asset types defined. Click + New Type to get started.</div>
  }
</div>
