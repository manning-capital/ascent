<app-page-header
  title="Provider Types"
  subtitle="Define provider classifications and their required metadata fields. Click a node to view details."
/>

@if (treeData() === null) {
  <div class="flex-1 min-h-0 p-4">
    <div class="w-full h-full rounded-lg border border-edge flex items-center justify-center">
      <div class="flex flex-col items-center gap-10">
        <p-skeleton width="10rem" height="2.5rem" borderRadius="8px" />
        <div class="flex items-center gap-16">
          <p-skeleton width="10rem" height="2.5rem" borderRadius="8px" />
          <p-skeleton width="10rem" height="2.5rem" borderRadius="8px" />
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="flex-1 min-h-0 p-4">
    <app-type-hierarchy-graph
      [trees]="treeData()!"
      (nodeClick)="onNodeClick($event)"
      (createType)="onCreateType($event)"
      (reparent)="onReparent($event)"
    />
  </div>
}

<app-reparent-confirm-dialog
  [(visible)]="reparentDialogVisible"
  (visibleChange)="onReparentDialogClose()"
  [preview]="reparentPreview()"
  [reparenting]="reparenting()"
  (confirm)="onReparentConfirm($event)"
/>
