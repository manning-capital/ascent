<div class="p-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Provider Types</h1>
      <p class="text-sm text-surface-500 mt-1">Define provider classifications and their required metadata fields.</p>
    </div>
    <p-button (onClick)="openCreate()" severity="info" [outlined]="true" size="small" label="+ New Type"/>
  </div>

  @if (showCreateForm()) {
    <p-card class="mb-6">
      <ng-template #header>
        <div class="px-5 pt-5">
          <h3 class="font-semibold">New Provider Type</h3>
        </div>
      </ng-template>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. Exchange, Broker, Data Provider" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional description" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" size="small" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [outlined]="true" size="small" label="Cancel"/>
      </div>
    </p-card>
  }

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (t of providerService.providerTypes(); track t.id) {
      <a [routerLink]="['/settings/provider-types', t.id]" class="block no-underline">
        <p-card styleClass="hover:bg-emphasis transition-colors cursor-pointer">
          <h3 class="font-semibold truncate mb-1">{{ t.name }}</h3>
          @if (t.description) {
            <p class="text-xs text-surface-400 line-clamp-2">{{ t.description }}</p>
          }
        </p-card>
      </a>
    } @empty {
      <div class="col-span-full text-center text-surface-400 py-12">No provider types defined.</div>
    }
  </div>
</div>
