<div class="p-6 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Attributes</h1>
      <p class="text-sm text-surface-500 mt-1">Define numerical attribute types used for temporal floating-point values (e.g., prices, scores, statistical measures).</p>
    </div>
    <p-button (onClick)="openCreate()" severity="primary" [outlined]="true" size="small" label="+ New Attribute"/>
  </div>

  @if (showCreateForm()) {
    <p-card class="mb-6">
      <ng-template #header>
        <div class="px-5 pt-5">
          <h3 class="font-semibold">New Attribute</h3>
        </div>
      </ng-template>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-surface-500 mb-1">Name *</label>
          <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. close_price, volume" class="w-full"/>
        </div>
        <div>
          <label class="block text-xs text-surface-500 mb-1">Description</label>
          <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional description" class="w-full"/>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" size="small" label="Create"/>
        <p-button (onClick)="cancelCreate()" severity="secondary" [outlined]="true" size="small" label="Cancel"/>
      </div>
    </p-card>
  }

  <app-data-table
    [columns]="columns"
    [rowData]="fieldService.attributes()"
    [loading]="fieldService.loading()"
    [pagination]="false"
    [rowClickRoute]="navigateToAttribute"
    emptyMessage="No attributes defined. Click + New Attribute to get started."/>
</div>
