<div class="flex flex-col h-[calc(100vh-3.5rem)] md:h-screen">
  <div class="p-6 flex flex-col flex-1 min-h-0 gap-4">
    <div class="flex items-center justify-between shrink-0">
      <div>
        <h1 class="text-2xl font-bold">Attributes</h1>
        <p class="text-sm text-surface-500 mt-1">Define numerical attribute types used for temporal floating-point values (e.g., prices, scores, statistical measures).</p>
      </div>
      <p-button (onClick)="openCreate()" severity="primary" [outlined]="true" size="small" label="+ New Attribute"/>
    </div>

    @if (showCreateForm()) {
      <p-card class="shrink-0">
        <ng-template #header>
          <div class="px-5 pt-5">
            <h3 class="font-semibold">New Attribute</h3>
          </div>
        </ng-template>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-surface-500 mb-1">Name *</label>
            <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. close_price, volume" class="w-full"/>
          </div>
          <div>
            <label class="block text-xs text-surface-500 mb-1">Description</label>
            <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional description" class="w-full"/>
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <p-button (onClick)="submitCreate()" severity="success" [outlined]="true" size="small" label="Create"/>
          <p-button (onClick)="cancelCreate()" severity="secondary" [outlined]="true" size="small" label="Cancel"/>
        </div>
      </p-card>
    }

    <!-- Filters -->
    <div class="rounded-lg border border-edge bg-surface p-4 shrink-0">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input type="text" pInputText placeholder="Search attributes..."
          [ngModel]="search()" (ngModelChange)="onSearch($event)">
        <p-select [ngModel]="statusFilter()" (ngModelChange)="onStatusChange($event)"
          [options]="statusOptions" optionLabel="label" optionValue="value"
          placeholder="All Statuses" [showClear]="true"/>
        <p-button (onClick)="clearFilters()" severity="secondary" [outlined]="true" label="Clear Filters"/>
      </div>
    </div>

    <app-server-table class="flex-1 min-h-0"
      [columns]="columns"
      [fetchPage]="fetchPage()"
      [rowClickRoute]="navigateToAttribute"
      [pageSize]="25"
      emptyMessage="No attributes defined. Click + New Attribute to get started."/>
  </div>
</div>
