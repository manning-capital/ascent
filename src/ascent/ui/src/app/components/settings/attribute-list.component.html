<app-page-header
  title="Attributes"
  subtitle="Numerical attribute types for temporal floating-point values (prices, scores, statistical measures)."
>
  <div actions>
    <p-button
      label="New attribute"
      severity="primary"
      size="small"
      icon="pi pi-plus"
      (onClick)="openCreate()"
    />
  </div>
</app-page-header>

@if (showCreateForm()) {
  <div class="border-b border-edge bg-canvas p-4 shrink-0">
    <h3 class="text-sm font-semibold mb-3">New Attribute</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] uppercase tracking-wider text-fg-muted mb-1">Name *</label>
        <input type="text" pInputText [(ngModel)]="newName" placeholder="e.g. close_price, volume" class="w-full text-xs" />
      </div>
      <div>
        <label class="block text-[11px] uppercase tracking-wider text-fg-muted mb-1">Description</label>
        <input type="text" pInputText [(ngModel)]="newDescription" placeholder="Optional description" class="w-full text-xs" />
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-3">
      <p-button label="Cancel" severity="secondary" [text]="true" size="small" (onClick)="cancelCreate()" />
      <p-button label="Create" severity="primary" size="small" icon="pi pi-check" (onClick)="submitCreate()" />
    </div>
  </div>
}

<div class="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-edge bg-canvas shrink-0">
  <span class="relative">
    <i class="pi pi-search absolute left-2 top-1/2 -translate-y-1/2 text-fg-faint text-xs"></i>
    <input
      type="text"
      pInputText
      placeholder="Search attributes"
      class="pl-7 text-xs"
      style="width: 14rem;"
      [ngModel]="search()"
      (ngModelChange)="onSearch($event)"
    />
  </span>

  <p-select
    [ngModel]="statusFilter()"
    (ngModelChange)="onStatusChange($event)"
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="All statuses"
    [showClear]="true"
    size="small"
    [style]="{ width: '11rem' }"
  />

  <p-button
    label="Clear filters"
    severity="secondary"
    [text]="true"
    size="small"
    icon="pi pi-filter-slash"
    (onClick)="clearFilters()"
  />
</div>

<app-data-table
  class="flex-1 min-h-0"
  [columns]="columns"
  [fetchPage]="fetchPage()"
  [rowClickRoute]="navigateToAttribute"
  storageKey="attributes-list"
  emptyMessage="No attributes defined."
  [edgeToEdge]="true"
/>
