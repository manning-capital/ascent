<!-- Top Navigation Bar -->
<nav class="fixed top-0 inset-x-0 h-14 z-50 flex items-center px-6 gap-8 glass bg-canvas/80 border-b border-edge">
  <!-- Logo -->
  <a routerLink="/dashboard" class="flex items-center gap-2 text-lg font-bold tracking-tight shrink-0">
    <svg class="w-6 h-6 text-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <span>Ascent</span>
  </a>

  <!-- Desktop Nav Links -->
  <div class="hidden md:flex items-center gap-1">
    <a routerLink="/dashboard" routerLinkActive="bg-fg/10 text-fg"
       class="px-3 py-1.5 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
      Dashboard
    </a>
    <a routerLink="/feeds" routerLinkActive="bg-fg/10 text-fg"
       class="px-3 py-1.5 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
      Feeds
    </a>
    <a routerLink="/strategies" routerLinkActive="bg-fg/10 text-fg"
       class="px-3 py-1.5 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
      Strategies
    </a>
    <a routerLink="/trades" routerLinkActive="bg-fg/10 text-fg"
       class="px-3 py-1.5 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all flex items-center gap-2">
      Trades
      <span class="w-2 h-2 rounded-full bg-positive animate-pulse-live"></span>
    </a>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Settings -->
  <a routerLink="/settings" routerLinkActive="bg-fg/10 text-fg" class="p-2 rounded-lg hover:bg-fg/10 transition-colors" title="Settings">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </a>

  <!-- Theme Toggle -->
  <button (click)="theme.toggle()" class="p-2 rounded-lg hover:bg-fg/10 transition-colors" title="Toggle theme">
    @if (theme.isDark()) {
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    } @else {
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    }
  </button>

  <!-- Mobile Hamburger -->
  <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-fg/10 transition-colors">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      @if (mobileMenuOpen()) {
        <path d="M18 6L6 18M6 6l12 12"/>
      } @else {
        <path d="M4 6h16M4 12h16M4 18h16"/>
      }
    </svg>
  </button>
</nav>

<!-- Mobile Menu Overlay -->
@if (mobileMenuOpen()) {
  <div class="fixed inset-0 z-40 bg-overlay md:hidden" (click)="closeMobileMenu()">
    <div class="mt-14 p-4 flex flex-col gap-1 bg-surface border-b border-edge" (click)="$event.stopPropagation()">
      <a routerLink="/dashboard" routerLinkActive="bg-fg/10 text-fg"
         (click)="closeMobileMenu()"
         class="px-4 py-3 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
        Dashboard
      </a>
      <a routerLink="/feeds" routerLinkActive="bg-fg/10 text-fg"
         (click)="closeMobileMenu()"
         class="px-4 py-3 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
        Feeds
      </a>
      <a routerLink="/strategies" routerLinkActive="bg-fg/10 text-fg"
         (click)="closeMobileMenu()"
         class="px-4 py-3 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
        Strategies
      </a>
      <a routerLink="/trades" routerLinkActive="bg-fg/10 text-fg"
         (click)="closeMobileMenu()"
         class="px-4 py-3 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all flex items-center gap-2">
        Trades
        <span class="w-2 h-2 rounded-full bg-positive animate-pulse-live"></span>
      </a>
      <div class="border-t border-edge my-1"></div>
      <a routerLink="/settings" routerLinkActive="bg-fg/10 text-fg"
         (click)="closeMobileMenu()"
         class="px-4 py-3 rounded-lg text-sm font-medium text-fg-muted hover:text-fg hover:bg-fg/5 transition-all">
        Settings
      </a>
    </div>
  </div>
}

<!-- Main Content -->
<main class="pt-14 min-h-screen">
  <router-outlet/>
</main>

<p-toast position="bottom-right"/>
<p-confirmDialog/>
