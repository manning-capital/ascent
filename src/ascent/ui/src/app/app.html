<!-- Left Sidebar (Desktop) -->
<nav class="hidden md:flex fixed left-0 inset-y-0 w-16 z-50 flex-col items-center py-3 bg-canvas border-r border-edge">
  <!-- Logo -->
  <a routerLink="/dashboard" class="flex items-center justify-center w-10 h-10 mb-4 rounded-xl hover:bg-emphasis transition-colors"
     pTooltip="Ascent" tooltipPosition="right">
    <svg class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
  </a>

  <!-- Divider -->
  <div class="w-8 border-t border-edge mb-3"></div>

  <!-- Navigation -->
  <div class="flex flex-col items-center gap-1.5">
    <!-- Home -->
    <a routerLink="/dashboard" routerLinkActive="bg-highlight text-primary"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Home" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>

    <!-- Feeds -->
    <a routerLink="/feeds" routerLinkActive="bg-highlight text-primary"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Feeds" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11a9 9 0 0 1 9 9"/>
        <path d="M4 4a16 16 0 0 1 16 16"/>
        <circle cx="5" cy="19" r="1"/>
      </svg>
    </a>

    <!-- Strategies -->
    <a routerLink="/strategies" routerLinkActive="bg-highlight text-primary"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Strategies" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    </a>

    <!-- Exchanges -->
    <a routerLink="/exchanges" routerLinkActive="bg-highlight text-primary"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Exchanges" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m17 2 4 4-4 4"/>
        <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
        <path d="m7 22-4-4 4-4"/>
        <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
      </svg>
    </a>

    <!-- Trades -->
    <a routerLink="/trades" routerLinkActive="bg-highlight text-primary"
       class="relative flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Trades" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-positive animate-pulse-live"></span>
    </a>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Bottom Actions -->
  <div class="flex flex-col items-center gap-1.5">
    <!-- Settings -->
    <a routerLink="/settings" routerLinkActive="bg-highlight text-primary"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all"
       pTooltip="Settings" tooltipPosition="right">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </a>

    <!-- Theme Toggle -->
    <button (click)="theme.toggle()"
       class="flex items-center justify-center w-10 h-10 rounded-xl text-fg-muted hover:bg-emphasis hover:text-fg transition-all cursor-pointer"
       pTooltip="Toggle theme" tooltipPosition="right">
      @if (theme.isDark()) {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </div>
</nav>
